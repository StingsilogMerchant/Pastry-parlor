<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastry Parlor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffe4ef;--card:#fff8fb;--ink:#7a2150;--soft:#b5588a;--pink:#ff6fa8;--pink-d:#e0487f;
  --mint:#bff0da;--butter:#ffe8a3;--line:#ffb8d4;--dot:#ffc9de;--on-pink:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#3a1229;--card:#53203d;--ink:#ffe1ef;--soft:#f3a9cb;--pink:#ff7fb2;--pink-d:#c93a76;--mint:#2f6e58;--butter:#7a5a1c;--line:#7b3560;--dot:#4a1a37;--on-pink:#3a1229}
}
:root[data-theme="dark"]{--bg:#3a1229;--card:#53203d;--ink:#ffe1ef;--soft:#f3a9cb;--pink:#ff7fb2;--pink-d:#c93a76;--mint:#2f6e58;--butter:#7a5a1c;--line:#7b3560;--dot:#4a1a37;--on-pink:#3a1229}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 2.5px,transparent 3px);background-size:26px 26px;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:14px 14px 28px}
h1{margin:4px 0 10px;text-align:center;font-size:2rem;font-weight:700;color:var(--pink-d)}
.hud{display:flex;gap:8px;margin-bottom:12px}
.pill{flex:1;background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 10px;text-align:center;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 6px 0 var(--line);margin-bottom:14px}
.stage{text-align:center}
.cust{font-size:3.6rem;line-height:1;display:inline-block}
.cust.happy{animation:hop .6s ease}
.cust.sad{animation:shake .45s ease}
.who{font-weight:600;color:var(--soft)}
.bubble{margin:8px auto 0;background:var(--butter);border-radius:22px;padding:10px 16px;font-size:1.15rem;line-height:1.35;font-weight:500}
.bar{height:14px;margin:12px auto 0;max-width:300px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--pink);border-radius:99px;transition:width .1s linear}
.bar.low i{background:#ff5a5a}
.shop{display:flex;flex-direction:column;align-items:center}
.preview{width:190px;height:190px;background:var(--mint);border-radius:50%;border:3px dashed var(--pink-d);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.preview svg{width:88%;height:88%}
.grp{width:100%;margin-top:8px}
.grp h3{margin:0 0 6px;font-size:1rem;font-weight:600;color:var(--soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:500;display:flex;align-items:center;gap:7px}
.opt[aria-pressed="true"]{background:var(--pink);border-color:var(--pink-d);color:var(--on-pink);font-weight:700}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.btn{background:var(--pink);color:var(--on-pink);border:0;border-radius:999px;padding:13px 26px;font-weight:700;font-size:1.15rem;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.serve{margin-top:16px;width:100%}
.overlay{position:fixed;inset:0;background:rgba(122,33,80,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.overlay[hidden]{display:none}
.modal{background:var(--card);border:4px solid var(--pink);border-radius:32px;padding:24px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 0 var(--pink-d)}
.modal h2{margin:0 0 4px;font-size:1.9rem;color:var(--pink-d)}
.modal p{margin:6px 0;line-height:1.4}
.modal .btn{margin-top:14px}
.big{font-size:2.6rem;line-height:1.15}
.modal .pic{width:120px;height:120px;margin:0 auto}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) rotate(-6deg)}70%{transform:translateY(0) rotate(5deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <h1>🎀 Pastry Parlor 🎀</h1>
  <div class="hud">
    <div class="pill" id="rnd">🛎️ 1/6</div>
    <div class="pill" id="coins">🪙 0</div>
    <div class="pill" id="time">⏰ 45s</div>
  </div>

  <section class="card stage">
    <div class="cust" id="cust">🐰</div>
    <div class="who" id="who"></div>
    <div class="bubble" id="wish"></div>
    <div class="bar" id="bar"><i></i></div>
  </section>

  <section class="card shop">
    <div class="preview" id="preview"></div>
    <div class="grp"><h3>Shape</h3><div class="opts" id="o-shape"></div></div>
    <div class="grp"><h3>Frosting</h3><div class="opts" id="o-frost"></div></div>
    <div class="grp"><h3>Topping</h3><div class="opts" id="o-top"></div></div>
    <button class="btn serve" id="serve">Serve it!</button>
  </section>
</main>

<div class="overlay" id="start">
  <div class="modal">
    <div class="big">🧁🍩🍪</div>
    <h2>Pastry Parlor</h2>
    <p>Six customers will each ask for a pastry. Design it yourself: pick a shape, a frosting and a topping, then serve it.</p>
    <p>Match 1 wish for a <b>Good</b> rating, 2 for <b>Better</b>, and all 3 for <b>Best</b>!</p>
    <button class="btn" id="go">Open the bakery</button>
  </div>
</div>

<div class="overlay" id="res" hidden>
  <div class="modal">
    <div class="pic" id="rpic"></div>
    <h2 id="rtitle"></h2>
    <div class="big" id="rstars"></div>
    <p id="rtext"></p>
    <div id="rdet"></div>
    <button class="btn" id="next">Next customer</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="modal">
    <div class="big">🎂</div>
    <h2>Bakery closed!</h2>
    <p id="sum"></p>
    <button class="btn" id="again">Bake again</button>
  </div>
</div>

<script>
(function(){
  var SHAPES=[["cupcake","Cupcake"],["donut","Donut"],["cookie","Cookie"],["cake","Layer cake"]];
  var FROST=[
    {id:"strawberry",n:"Strawberry",c:"#ff8fb8",d:"#e0568c"},
    {id:"vanilla",n:"Vanilla",c:"#fff0cf",d:"#e0bd78"},
    {id:"mint",n:"Mint",c:"#9fe8c8",d:"#5cc49a"},
    {id:"lavender",n:"Lavender",c:"#cdb4ff",d:"#9b7be0"},
    {id:"chocolate",n:"Chocolate",c:"#9a6248",d:"#6e3f2b"}];
  var TOPS=[["none","Nothing",""],["sprinkles","Sprinkles","sprinkles"],["cherry","Cherry","a cherry"],["heart","Hearts","hearts"],["star","Stars","stars"]];
  var FRIENDS=[["🐰","Mochi"],["🐻","Bruno"],["🐱","Luna"],["🐶","Biscuit"],["🦊","Rosie"],["🐹","Peanut"],["🐼","Bao"],["🐨","Koko"]];
  var PTS={cupcake:[[100,44],[80,64],[120,64]],donut:[[100,48],[152,96],[48,100],[128,152],[72,152]],
           cookie:[[100,100],[70,84],[132,116],[84,130],[126,78]],cake:[[100,82],[66,86],[134,86]]};
  var $=function(id){return document.getElementById(id)};
  var by=function(a,id){for(var i=0;i<a.length;i++)if((a[i].id||a[i][0])===id)return a[i]};

  function topSvg(t,pts){
    if(t==="none")return "";
    var o="",i,x,y;
    if(t==="cherry"){x=pts[0][0];y=pts[0][1];
      return '<path d="M'+x+' '+(y-4)+'Q'+(x+8)+' '+(y-22)+' '+(x+16)+' '+(y-24)+'" stroke="#3f8f4a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="'+x+'" cy="'+y+'" r="11" fill="#e0243f" stroke="#a8112a" stroke-width="2"/><circle cx="'+(x-4)+'" cy="'+(y-4)+'" r="3" fill="#fff" opacity=".7"/>';}
    for(i=0;i<(t==="sprinkles"?pts.length:3);i++){x=pts[i][0];y=pts[i][1];
      if(t==="sprinkles")o+='<g transform="translate('+x+' '+y+')"><rect x="-13" y="-4" width="10" height="4" rx="2" fill="#ff4f8b" transform="rotate(25)"/><rect x="2" y="-9" width="10" height="4" rx="2" fill="#4fb6ff" transform="rotate(-30)"/><rect x="-5" y="5" width="10" height="4" rx="2" fill="#ffd23f" transform="rotate(70)"/><rect x="6" y="4" width="10" height="4" rx="2" fill="#7be0a6" transform="rotate(-10)"/></g>';
      else if(t==="heart")o+='<path transform="translate('+x+' '+y+') scale(1.1)" d="M0 8C-17-4-9-17 0-8C9-17 17-4 0 8Z" fill="#ff4f8b" stroke="#fff" stroke-width="2"/>';
      else o+='<path transform="translate('+x+' '+y+') scale(1.1)" d="M0-11L3-3L11-3L5 2L7 10L0 5L-7 10L-5 2L-11-3L-3-3Z" fill="#ffd23f" stroke="#e8a800" stroke-width="2"/>';
    }
    return o;
  }

  function pastry(shape,fid,t){
    var f=by(FROST,fid),c=f.c,d=f.d,o="";
    if(shape==="cupcake"){
      o='<path d="M54 108H146L134 176Q132 184 124 184H76Q68 184 66 176Z" fill="#ffb3cf" stroke="#e0568c" stroke-width="3"/><path d="M82 112L86 182M100 112V184M118 112L114 182" stroke="#e0568c" stroke-width="2.5" opacity=".45"/>'+
        '<ellipse cx="100" cy="104" rx="52" ry="22" fill="'+c+'" stroke="'+d+'" stroke-width="3"/><ellipse cx="100" cy="82" rx="40" ry="20" fill="'+c+'" stroke="'+d+'" stroke-width="3"/><ellipse cx="100" cy="62" rx="27" ry="16" fill="'+c+'" stroke="'+d+'" stroke-width="3"/>';
    }else if(shape==="donut"){
      o='<circle cx="100" cy="102" r="76" fill="#e8b27a" stroke="#c98b4f" stroke-width="3"/><circle cx="100" cy="102" r="64" fill="'+c+'" stroke="'+d+'" stroke-width="3"/><circle cx="100" cy="102" r="26" fill="var(--mint)" stroke="#c98b4f" stroke-width="3"/>';
    }else if(shape==="cookie"){
      o='<circle cx="100" cy="102" r="76" fill="#e0aa6a" stroke="#b9803f" stroke-width="3"/><circle cx="100" cy="102" r="60" fill="'+c+'" stroke="'+d+'" stroke-width="3"/>';
    }else{
      o='<rect x="38" y="104" width="124" height="72" rx="14" fill="#f6d89a" stroke="#d6b06a" stroke-width="3"/><rect x="38" y="130" width="124" height="14" fill="'+c+'" stroke="'+d+'" stroke-width="2"/>'+
        '<rect x="32" y="88" width="136" height="26" rx="13" fill="'+c+'" stroke="'+d+'" stroke-width="3"/><circle cx="58" cy="114" r="9" fill="'+c+'" stroke="'+d+'" stroke-width="2"/><circle cx="100" cy="116" r="11" fill="'+c+'" stroke="'+d+'" stroke-width="2"/><circle cx="144" cy="114" r="9" fill="'+c+'" stroke="'+d+'" stroke-width="2"/>';
    }
    return '<svg viewBox="0 0 200 200" role="img" aria-label="Your pastry">'+o+topSvg(t,PTS[shape])+'</svg>';
  }

  var s={best:0};
  try{s.best=parseInt(localStorage.getItem("pp-best"),10)||0}catch(e){}
  var timer=null;
  function def(){return {shape:"cupcake",frost:"strawberry",top:"none"}}

  function buildOpts(id,list,key,mk){
    var box=$(id);box.innerHTML="";
    list.forEach(function(it){
      var v=it.id||it[0],b=document.createElement("button");
      b.className="opt";b.innerHTML=mk(it);b.setAttribute("data-v",v);
      b.onclick=function(){if(s.on&&!s.wait){s.pick[key]=v;draw()}};
      box.appendChild(b);
    });
  }
  buildOpts("o-shape",SHAPES,"shape",function(i){return i[1]});
  buildOpts("o-frost",FROST,"frost",function(i){return '<span class="sw" style="background:'+i.c+'"></span>'+i.n});
  buildOpts("o-top",TOPS,"top",function(i){return i[1]});

  function draw(){
    ["shape","frost","top"].forEach(function(k){
      var bs=$("o-"+k).children;
      for(var i=0;i<bs.length;i++)bs[i].setAttribute("aria-pressed",bs[i].getAttribute("data-v")===s.pick[k]);
    });
    $("preview").innerHTML=pastry(s.pick.shape,s.pick.frost,s.pick.top);
    $("rnd").textContent="🛎️ "+s.round+"/"+s.total;
    $("coins").textContent="🪙 "+s.coins;
    $("time").textContent="⏰ "+Math.max(0,Math.ceil(s.pat))+"s";
    var pct=Math.max(0,s.pat/s.max*100);
    $("bar").firstElementChild.style.width=pct+"%";
    $("bar").className="bar"+(pct<30?" low":"");
  }

  function newCustomer(){
    s.round++;s.wait=false;s.pick=def();s.max=s.pat=45;
    var r=function(a){return a[Math.floor(Math.random()*a.length)]};
    var sh=r(SHAPES),fr=r(FROST),tp=r(TOPS.slice(1)),fr0=by(FROST,fr.id),fd=r(FRIENDS);
    s.wish={shape:sh[0],frost:fr.id,top:tp[0]};
    var c=$("cust");c.className="cust";c.textContent=fd[0];$("who").textContent=fd[1];
    $("wish").textContent="Hi! Could I please have a "+sh[1].toLowerCase()+" with "+fr0.n.toLowerCase()+" frosting and "+tp[2]+" on top?";
    draw();
  }

  function react(cls){var c=$("cust");c.className="cust";void c.offsetWidth;c.className="cust "+cls}

  function showResult(m,missed){
    s.wait=true;react(m>0?"happy":"sad");
    var R={3:["Best!","⭐⭐⭐","Exactly what I dreamed of!"],2:["Better!","⭐⭐","So pretty! Almost perfect."],1:["Good!","⭐","Thank you, that’s sweet."],0:["Oh no…","💔","That’s not what I asked for."]};
    var info=R[m],gain=[0,10,25,50][m]+(m?Math.ceil(s.pat/3):0);
    if(missed){info=["Too slow…","🕐","They got tired of waiting and left."];gain=0;s.miss++}
    else s["r"+m]++;
    s.coins+=gain;
    $("rpic").innerHTML=pastry(s.pick.shape,s.pick.frost,s.pick.top);
    $("rtitle").textContent=info[0];$("rstars").textContent=info[1];
    $("rtext").textContent=info[2]+(gain?" +"+gain+" coins":"");
    var k=[["shape","Shape",function(v){return by(SHAPES,v)[1]}],["frost","Frosting",function(v){return by(FROST,v).n}],["top","Topping",function(v){return by(TOPS,v)[1]}]];
    $("rdet").innerHTML=k.map(function(x){
      var ok=s.pick[x[0]]===s.wish[x[0]];
      return "<p>"+(ok?"✅ ":"❌ ")+x[1]+": "+(ok?x[2](s.wish[x[0]]):"wanted "+x[2](s.wish[x[0]])+", got "+x[2](s.pick[x[0]]))+"</p>";
    }).join("");
    $("next").textContent=s.round>=s.total?"See my day":"Next customer";
    $("res").hidden=false;$("next").focus();draw();
  }

  $("serve").onclick=function(){
    if(!s.on||s.wait)return;
    var m=0;["shape","frost","top"].forEach(function(k){if(s.pick[k]===s.wish[k])m++});
    showResult(m,false);
  };
  $("next").onclick=function(){
    $("res").hidden=true;
    if(s.round>=s.total)finish();else newCustomer();
  };

  function tick(){
    if(!s.on||s.wait)return;
    s.pat-=.1;
    if(s.pat<=0){s.pat=0;showResult(0,true);return}
    draw();
  }

  function start(){
    s={on:true,wait:false,round:0,total:6,coins:0,r3:0,r2:0,r1:0,r0:0,miss:0,best:s.best,pick:def(),pat:45,max:45};
    $("start").hidden=true;$("end").hidden=true;$("res").hidden=true;
    newCustomer();
    clearInterval(timer);timer=setInterval(tick,100);
  }

  function finish(){
    s.on=false;clearInterval(timer);
    var isBest=s.coins>s.best;
    if(isBest){s.best=s.coins;try{localStorage.setItem("pp-best",String(s.best))}catch(e){}}
    var pts=s.r3*3+s.r2*2+s.r1,avg=pts/s.total,grade=avg>=2.4?"Best":avg>=1.6?"Better":"Good";
    $("sum").innerHTML="⭐⭐⭐ Best: "+s.r3+"<br>⭐⭐ Better: "+s.r2+"<br>⭐ Good: "+s.r1+"<br>💔 Not quite: "+(s.r0+s.miss)+
      "<br><br>Shop rating: <b>"+grade+"</b><br>🪙 "+s.coins+" coins"+(isBest?" (new best!)":" · best "+s.best);
    $("end").hidden=false;$("again").focus();
  }

  $("go").onclick=start;$("again").onclick=start;
  s=Object.assign(s,{on:false,round:0,total:6,coins:0,pat:45,max:45,pick:def()});
  draw();
})();
</script>
</body>
</html>
